name : Build and Store Artifacts

on : [push]

jobs:
  builds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Project
        run: |
          mkdir -p output
          echo "Hello, World" > output/artifact.txt
          ls -l output/ #Debudding: List contents
          cat output/artifact.txt #Debugging: Show file content

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: output/

  downloads:
    runs-on: ubuntu-latest
    needs: builds
    steps:
      - name: Download artifacts from GitHub Actions
        uses: actions/download-artifact@v4    #actions ____@v
        with:
          name: my-artifact
          path: downloaded-artifact

      - name: Display Artifact Content
        run: |
          ls -l downloaded-artifact/  #Debugging: List files
          cat downloaded-artifact/artifact.txt || echo "File is empty or missing"